<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>📸 My Room — There is / There are</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #fdf6e3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
            padding: 15px;
        }
        .game-wrapper {
            width: 100%;
            max-width: 600px;
            text-align: center;
            background: white;
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            border: 3px solid #ff6b8a;
        }
        h1 {
            font-size: clamp(22px, 3.5vw, 30px);
            color: #e67e22;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 16px;
        }
        .photo-area {
            width: 100%;
            aspect-ratio: 4/3;
            background: #f0f0f0;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 3px dashed #e8c4a0;
            margin-bottom: 12px;
            position: relative;
        }
        .photo-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-placeholder {
            font-size: 50px;
            color: #ccc;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            color: white;
            transition: 0.15s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
        }
        .btn:active { transform: scale(0.95); }
        .btn-photo { background: #ff6b8a; }
        .btn-speak { background: #4ecdc4; }
        .btn-check { background: #27ae60; }
        .btn-clear { background: #95a5a6; }
        .btn-share { background: #9b59b6; }

        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: 2px solid #e8c4a0;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            min-height: 70px;
            margin-bottom: 8px;
        }
        textarea:focus {
            border-color: #ff6b8a;
            outline: none;
            box-shadow: 0 0 0 3px rgba(255,107,138,0.15);
        }
        .example {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            background: #fff9e0;
            padding: 6px 10px;
            border-radius: 10px;
            display: inline-block;
        }
        .feedback {
            font-size: 16px;
            font-weight: 700;
            min-height: 24px;
            margin-top: 6px;
        }
        .feedback.correct { color: #27ae60; }
        .feedback.wrong { color: #e74c3c; }
        @media (max-width: 500px) {
            .game-wrapper { padding: 16px 12px; }
            .btn { font-size: 12px; padding: 8px 14px; }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <h1>📸 My Room</h1>
    <p class="subtitle">Take a photo or choose from gallery, describe your room, and share!</p>

    <div class="photo-area" id="photoArea">
        <span class="photo-placeholder" id="photoPlaceholder">📷</span>
        <img id="photoImg" style="display:none;" alt="Your room">
    </div>

    <div class="btn-row">
        <button class="btn btn-photo" onclick="document.getElementById('fileInput').click()">📷 Take / Choose Photo</button>
        <button class="btn btn-clear" onclick="clearAll()">🗑️ Clear</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="loadPhoto(event)">

    <div class="example">💡 Example: <b>There is a bed next to the window. There are books on the desk.</b></div>
    <textarea id="description" placeholder="Describe your room..."></textarea>

    <div class="btn-row">
        <button class="btn btn-speak" onclick="speakText()">🔊 Listen</button>
        <button class="btn btn-check" onclick="checkDescription()">✅ Check</button>
        <button class="btn btn-share" onclick="shareResult()">📤 Share</button>
    </div>
    <div class="feedback" id="feedback"></div>
</div>

<script>
    function loadPhoto(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('photoImg').src = e.target.result;
            document.getElementById('photoImg').style.display = 'block';
            document.getElementById('photoPlaceholder').style.display = 'none';
        };
        reader.readAsDataURL(file);
    }

    function clearAll() {
        document.getElementById('photoImg').style.display = 'none';
        document.getElementById('photoPlaceholder').style.display = 'block';
        document.getElementById('photoImg').src = '';
        document.getElementById('fileInput').value = '';
        document.getElementById('description').value = '';
        document.getElementById('feedback').textContent = '';
        document.getElementById('feedback').className = 'feedback';
    }

    function speakText() {
        const text = document.getElementById('description').value.trim();
        if (!text) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.85;
        speechSynthesis.speak(u);
    }

    function checkDescription() {
        const text = document.getElementById('description').value.trim();
        const fb = document.getElementById('feedback');
        if (!text) {
            fb.textContent = '✏️ Write something first!';
            fb.className = 'feedback wrong';
            return;
        }
        const hasThere = /there\s+(is|are)/i.test(text);
        if (hasThere) {
            fb.textContent = '🌟 Great! You used there is / there are!';
            fb.className = 'feedback correct';
        } else {
            fb.textContent = '💡 Try using "There is..." or "There are..."';
            fb.className = 'feedback wrong';
        }
    }

    function shareResult() {
        const text = document.getElementById('description').value.trim();
        if (!text) {
            document.getElementById('feedback').textContent = '✏️ Write something first!';
            document.getElementById('feedback').className = 'feedback wrong';
            return;
        }
        const shareText = '📸 My Room: ' + text + '\n\nСделано в тренажёре! 🚀';
        if (navigator.share) {
            navigator.share({ text: shareText }).catch(() => {});
        } else {
            navigator.clipboard.writeText(shareText).then(() => {
                const fb = document.getElementById('feedback');
                fb.textContent = '📋 Copied! Paste it in a messenger.';
                fb.className = 'feedback correct';
            }).catch(() => {
                alert(shareText);
            });
        }
    }
</script>
</body>
</html>
