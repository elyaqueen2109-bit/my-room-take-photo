<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>📸 My Room — There is / There are</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #fdf6e3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
            padding: 15px;
        }
        .game-wrapper {
            width: 100%;
            max-width: 600px;
            text-align: center;
            background: white;
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            border: 3px solid #ff6b8a;
        }
        h1 { font-size: clamp(22px, 3.5vw, 30px); color: #e67e22; margin-bottom: 4px; }
        .subtitle { font-size: 14px; color: #888; margin-bottom: 16px; }
        .photo-area {
            width: 100%; aspect-ratio: 4/3; background: #f0f0f0;
            border-radius: 16px; display: flex; align-items: center; justify-content: center;
            overflow: hidden; border: 3px dashed #e8c4a0; margin-bottom: 12px;
            position: relative;
        }
        .photo-area img { width: 100%; height: 100%; object-fit: cover; }
        .photo-placeholder { font-size: 50px; color: #ccc; }
        .sticker-on-photo {
            position: absolute; font-size: 28px; pointer-events: none;
            transform: translate(-50%, -50%); z-index: 10;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
        }
        .sticker-panel {
            display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px;
        }
        .sticker-btn {
            font-size: 24px; cursor: pointer; background: #fff; border: 2px solid #e8c4a0;
            border-radius: 50%; width: 40px; height: 40px; display: flex;
            align-items: center; justify-content: center; transition: 0.15s;
        }
        .sticker-btn:hover { background: #fff5f5; border-color: #ff6b8a; }
        .sticker-btn.active { background: #ffe0e0; border-color: #ff6b8a; }
        .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
        .btn {
            padding: 10px 20px; border-radius: 20px; border: none;
            font-weight: 700; cursor: pointer; font-family: inherit;
            font-size: 14px; color: white; transition: 0.15s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
        }
        .btn:active { transform: scale(0.95); }
        .btn-photo { background: #ff6b8a; }
        .btn-speak { background: #4ecdc4; }
        .btn-record { background: #e74c3c; }
        .btn-record.recording { background: #c0392b; box-shadow: 0 0 20px rgba(231,76,60,0.5); }
        .btn-check { background: #27ae60; }
        .btn-clear { background: #95a5a6; }
        .btn-share { background: #9b59b6; }

        textarea {
            width: 100%; padding: 12px; border-radius: 14px;
            border: 2px solid #e8c4a0; font-size: 15px; font-family: inherit;
            resize: vertical; min-height: 60px; margin-bottom: 4px;
        }
        textarea:focus { border-color: #ff6b8a; outline: none; box-shadow: 0 0 0 3px rgba(255,107,138,0.15); }
        .example {
            font-size: 12px; color: #888; margin-bottom: 8px;
            background: #fff9e0; padding: 6px 10px; border-radius: 10px; display: inline-block;
        }
        .feedback { font-size: 16px; font-weight: 700; min-height: 24px; margin-top: 6px; }
        .feedback.correct { color: #27ae60; } .feedback.wrong { color: #e74c3c; }
        .status { font-size: 11px; color: #999; margin-top: 2px; }
        @media (max-width: 500px) {
            .game-wrapper { padding: 16px 12px; }
            .btn { font-size: 12px; padding: 8px 14px; }
            .sticker-btn { width: 34px; height: 34px; font-size: 20px; }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <h1>📸 My Room</h1>
    <p class="subtitle">Take a photo, add stickers, describe your room — type or talk!</p>

    <div class="photo-area" id="photoArea">
        <span class="photo-placeholder" id="photoPlaceholder">📷</span>
        <img id="photoImg" style="display:none;" alt="Your room">
    </div>

    <div class="sticker-panel">
        <span class="sticker-btn" data-emoji="❤️">❤️</span>
        <span class="sticker-btn" data-emoji="⭐">⭐</span>
        <span class="sticker-btn" data-emoji="💖">💖</span>
        <span class="sticker-btn" data-emoji="✨">✨</span>
        <span class="sticker-btn" data-emoji="🔥">🔥</span>
        <span class="sticker-btn" data-emoji="👍">👍</span>
        <span class="sticker-btn" data-emoji="🎉">🎉</span>
        <span class="sticker-btn" data-emoji="😍">😍</span>
    </div>

    <div class="btn-row">
        <button class="btn btn-photo" onclick="document.getElementById('fileInput').click()">📷 Take / Choose Photo</button>
        <button class="btn btn-clear" onclick="clearAll()">🗑️ Clear</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="loadPhoto(event)">

    <div class="example">💡 Example: <b>There is a bed next to the window. There are books on the desk.</b></div>
    <textarea id="description" placeholder="Describe your room... (or use microphone 🎤)"></textarea>

    <div class="btn-row">
        <button class="btn btn-speak" onclick="speakText()">🔊 Listen</button>
        <button class="btn btn-record" id="btnRecord" onclick="toggleRecording()">🎤 Speak</button>
        <button class="btn btn-check" onclick="checkDescription()">✅ Check</button>
        <button class="btn btn-share" onclick="shareResult()">📤 Share</button>
    </div>
    <div class="status" id="status"></div>
    <div class="feedback" id="feedback"></div>
</div>

<script>
    const photoArea = document.getElementById('photoArea');
    const photoImg = document.getElementById('photoImg');
    const photoPlaceholder = document.getElementById('photoPlaceholder');
    const description = document.getElementById('description');
    const feedback = document.getElementById('feedback');
    const status = document.getElementById('status');
    const btnRecord = document.getElementById('btnRecord');

    let activeSticker = null;
    let recognition = null;
    let isRecording = false;

    // ====== PHOTO ======
    function loadPhoto(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            photoImg.src = e.target.result;
            photoImg.style.display = 'block';
            photoPlaceholder.style.display = 'none';
        };
        reader.readAsDataURL(file);
    }

    // ====== STICKERS ======
    document.querySelectorAll('.sticker-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            // Toggle active
            if (activeSticker === this.dataset.emoji) {
                activeSticker = null;
                document.querySelectorAll('.sticker-btn').forEach(b => b.classList.remove('active'));
                photoArea.style.cursor = 'default';
            } else {
                activeSticker = this.dataset.emoji;
                document.querySelectorAll('.sticker-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                photoArea.style.cursor = 'crosshair';
            }
        });
    });

    photoArea.addEventListener('click', function(e) {
        if (!activeSticker) return;
        if (e.target.tagName === 'SPAN' && e.target.classList.contains('sticker-on-photo')) return;
        
        const rect = photoArea.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const sticker = document.createElement('span');
        sticker.className = 'sticker-on-photo';
        sticker.textContent = activeSticker;
        sticker.style.left = x + 'px';
        sticker.style.top = y + 'px';
        photoArea.appendChild(sticker);
    });

    // ====== SPEECH RECOGNITION ======
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        status.textContent = '⚠️ Speech recognition not supported. Try Chrome.';
        btnRecord.disabled = true;
    }

    function toggleRecording() {
        if (!SpeechRecognition) { alert('Please use Chrome.'); return; }
        isRecording ? stopRecording() : startRecording();
    }

    function startRecording() {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.continuous = false;

        recognition.onstart = function() {
            isRecording = true;
            btnRecord.textContent = '⏹ Stop';
            btnRecord.classList.add('recording');
            status.textContent = '🎤 Speaking...';
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            description.value += (description.value ? ' ' : '') + transcript;
            status.textContent = '✅ Added to text!';
        };

        recognition.onerror = function(event) {
            status.textContent = '❌ ' + event.error + '. Try again.';
            stopRecording();
        };

        recognition.onend = function() { stopRecording(); };

        // Beep
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.15);
        } catch(e) {}

        setTimeout(() => recognition.start(), 200);
    }

    function stopRecording() {
        isRecording = false;
        btnRecord.textContent = '🎤 Speak';
        btnRecord.classList.remove('recording');
        if (recognition) { recognition.stop(); recognition = null; }
    }

    // ====== SPEAK TEXT ======
    function speakText() {
        const text = description.value.trim();
        if (!text) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US'; u.rate = 0.85;
        speechSynthesis.speak(u);
    }

    // ====== CHECK ======
    function checkDescription() {
        const text = description.value.trim();
        if (!text) {
            feedback.textContent = '✏️ Write or say something first!';
            feedback.className = 'feedback wrong'; return;
        }
        const hasThere = /there\s+(is|are)/i.test(text);
        if (hasThere) {
            feedback.textContent = '🌟 Great! You used there is / there are!';
            feedback.className = 'feedback correct';
        } else {
            feedback.textContent = '💡 Try using "There is..." or "There are..."';
            feedback.className = 'feedback wrong';
        }
    }

    // ====== SHARE ======
    function shareResult() {
        const text = description.value.trim();
        if (!text) {
            feedback.textContent = '✏️ Write or say something first!';
            feedback.className = 'feedback wrong'; return;
        }
        const shareText = '📸 My Room: ' + text + '\n\nСделано в тренажёре! 🚀';
        if (navigator.share) {
            navigator.share({ text: shareText }).catch(() => {});
        } else {
            navigator.clipboard.writeText(shareText).then(() => {
                feedback.textContent = '📋 Copied! Paste in a messenger.';
                feedback.className = 'feedback correct';
            }).catch(() => alert(shareText));
        }
    }

    // ====== CLEAR ======
    function clearAll() {
        photoImg.style.display = 'none';
        photoPlaceholder.style.display = 'block';
        photoImg.src = '';
        document.getElementById('fileInput').value = '';
        description.value = '';
        feedback.textContent = '';
        feedback.className = 'feedback';
        status.textContent = '';
        document.querySelectorAll('.sticker-on-photo').forEach(s => s.remove());
        activeSticker = null;
        document.querySelectorAll('.sticker-btn').forEach(b => b.classList.remove('active'));
        photoArea.style.cursor = 'default';
    }
</script>
</body>
</html>
